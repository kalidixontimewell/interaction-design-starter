<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your title here</title>

  <!-- Your Google Font. Swap these for the font you chose. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main>

    <!-- Chapter 1: the corner. Beats 01 and 02 share one held picture.
         Beat 01 is also the cover, so this page has no <header>. -->
    <section class="chapter" id="chapter-1-the-corner">
      <div class="held">
        <img src="images/scene-01.svg" alt="The bar today.">
      </div>
      <div class="beat" id="beat-01-today">
        <h1>History of D&D</h1>
      </div>
      <div class="beat" id="beat-02-1905">
        <p>1905. Built as a bank.</p>
      </div>
    </section>

    <!-- Chapter 2: the closing. Three beats, each with its own picture -->
    <section class="chapter" id="chapter-2-the-closing">
      <div class="beat" id="beat-03-queue">
        <h2>How It Works</h2>
      </div>
      <div class="beat" id="beat-04-closures">
        <h2>Closures</h2>
      </div>
      <div class="beat" id="beat-05-notice">
        <h2>The notice</h2>
      </div>
    </section>

    <!-- Chapter 3: inside. Beat 07 is the interaction -->
    <section class="chapter" id="chapter-3-inside">
      <div class="beat" id="beat-06-refit">
        <h2>The refit</h2>
      </div>
      <div class="beat" id="beat-07-then-now">
        <!-- INTERACTION: before/after slider -->
        <h2>Then and now</h2>
      </div>
    </section>

    <!-- Chapter 4: outside -->
    <section class="chapter" id="chapter-4-outside">
      <div class="beat" id="beat-08-outside">
        <h2>Outside</h2>
      </div>
    </section>

  </main>

  <!-- Credits belong to the whole page, so they sit outside the chapters -->
  <footer>
    <h2>Sources and credits</h2>
    <ul>
      <li>Every source and every picture: who, what, where, licence.</li>
    </ul>
  </footer>

  <script src="js/main.js"></script>

</body>
</html>
